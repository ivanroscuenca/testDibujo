<!DOCTYPE html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"><title>Test dibujo X hijos no deseados</title>
<style>
:root{--bg:#f4f5f7;--card:#fff;--tx:#1d2330;--mu:#6b7385;--ac:#2563eb;--ok:#16a34a;--ko:#dc2626;--bd:#d9dde5;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#141821;--card:#1e2430;--tx:#e8ebf2;--mu:#98a1b5;--ac:#5b8cff;--ok:#34d399;--ko:#f87171;--bd:#323a4b;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#141821;--card:#1e2430;--tx:#e8ebf2;--mu:#98a1b5;--ac:#5b8cff;--ok:#34d399;--ko:#f87171;--bd:#323a4b;color-scheme:dark}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--tx);font:16px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
main{max-width:760px;margin:0 auto;padding:16px}
.card{background:var(--card);border:1px solid var(--bd);border-radius:14px;padding:16px;margin-bottom:12px}
h1{font-size:1.4rem;margin:.2em 0}p{color:var(--mu);margin:.3em 0}
button{font:inherit;cursor:pointer;border-radius:10px;border:1px solid var(--bd);background:var(--card);color:var(--tx);padding:12px 16px}
.pri{background:var(--ac);color:#fff;border-color:var(--ac)}.big{display:block;width:100%;margin:8px 0;text-align:left}
.bar{height:6px;background:var(--bd);border-radius:6px;overflow:hidden;margin:8px 0 12px}.bar i{display:block;height:100%;background:var(--ac)}
.top{display:flex;justify-content:space-between;color:var(--mu);font-size:.9rem}
.img{background:#fff;border-radius:10px;padding:6px;text-align:center}.img img{max-width:100%;height:auto;display:block;margin:auto}
.opts{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin:14px 0}.opts button{font-size:1.5rem;font-weight:700;padding:16px;text-transform:uppercase}
.opts .ok{background:var(--ok);color:#fff;border-color:var(--ok)}.opts .ko{background:var(--ko);color:#fff;border-color:var(--ko)}
.fb{min-height:1.5em;font-weight:600}.note{color:var(--mu);font-size:.85rem}
.row{display:flex;gap:8px;align-items:center;justify-content:space-between;padding:6px 0;border-bottom:1px solid var(--bd)}
.g{color:var(--ok)}.r{color:var(--ko)}
</style></head><body><main id="app"></main>
